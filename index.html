<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Plan: 10th Grade</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #f43f5e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 450px;
            width: 100%;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
        }
        h1 { font-size: 1.8rem; margin-bottom: 8px; color: var(--accent); }
        .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
        .stat-box { background: rgba(0,0,0,0.2); padding: 16px; border-radius: 12px; }
        .number { font-size: 2rem; font-weight: bold; margin-bottom: 4px; }
        .label { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; }
        .progress-container { background: rgba(255,255,255,0.1); border-radius: 8px; height: 16px; width: 100%; margin-bottom: 24px; overflow: hidden; }
        .progress-bar { background: var(--accent); height: 100%; width: 0%; transition: width 0.5s ease; }
        textarea { width: 100%; height: 80px; background: rgba(0,0,0,0.2); border: 1px solid #334155; border-radius: 8px; color: var(--text-main); padding: 10px; box-sizing: border-box; resize: none; margin-bottom: 12px; }
        button { background: var(--accent); color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }
        button:hover { opacity: 0.9; }
        .rant-log { margin-top: 16px; text-align: left; max-height: 120px; overflow-y: auto; font-size: 0.85rem; color: var(--text-muted); border-top: 1px solid #334155; padding-top: 12px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Escape Plan: Tronc Commun</h1>
    <div class="subtitle">Counting down the days to July 1, 2027</div>

    <div class="stat-grid">
        <div class="stat-box">
            <div class="number" id="days-done">0</div>
            <div class="label">Days Survived</div>
        </div>
        <div class="stat-box">
            <div class="number" id="days-left">0</div>
            <div class="label">Days Remaining</div>
        </div>
    </div>

    <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <textarea id="rant-input" placeholder="Type today's complaint here... (Saved automatically)"></textarea>
    <button onclick="saveRant()">Log Today's Diary</button>
    <div class="rant-log" id="rant-log"></div>
</div>

<script>
    // Config: Exact target dates
    const startDate = new Date('2026-09-07');
    const endDate = new Date('2027-07-01');

    function updateDashboard() {
        const today = new Date();
        
        // Calculate millisecond differences
        const totalDuration = endDate - startDate;
        const timePassed = today - startDate;
        const timeLeft = endDate - today;

        // Convert to absolute whole days
        const daysDone = Math.max(0, Math.floor(timePassed / (1000 * 60 * 60 * 24)));
        const daysLeft = Math.max(0, Math.ceil(timeLeft / (1000 * 60 * 60 * 24)));
        
        // Calculate real percentage progress
        const percent = Math.min(100, Math.max(0, (timePassed / totalDuration) * 100));

        // Inject into HTML
        document.getElementById('days-done').innerText = daysDone;
        document.getElementById('days-left').innerText = daysLeft;
        document.getElementById('progress-bar').style.width = percent.toFixed(1) + '%';
    }

    function saveRant() {
        const text = document.getElementById('rant-input').value.trim();
        if(!text) return;
        
        let rants = JSON.parse(localStorage.getItem('myRants') || '[]');
        const entry = `${new Date().toLocaleDateString()}: ${text}`;
        rants.unshift(entry); // Add newest to top
        
        localStorage.setItem('myRants', JSON.stringify(rants));
        document.getElementById('rant-input').value = '';
        renderRants();
    }

    function renderRants() {
        let rants = JSON.parse(localStorage.getItem('myRants') || '[]');
        const log = document.getElementById('rant-log');
        log.innerHTML = rants.map(r => `<div>• ${r}</div>`).join('');
    }

    // Initialize on load
    updateDashboard();
    renderRants();
</script>

</body>
</html>
